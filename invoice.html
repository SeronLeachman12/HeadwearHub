<!DOCTYPE html>
<html lang="en">
<head>
  <title>Invoice</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial; 
      margin:0; padding:20px; 
      background:#f4f4f4;
    }
    .invoice-container {
      max-width:600px;
       margin:auto; 
       background:white; 
       padding:20px; 
       border-radius:8px;
      }
    .item {
      display:flex; 
      align-items:center; 
      margin-bottom:10px;
    }
    .item img {
      width:60px; 
      height:60px; 
      margin-right:15px; 
      border-radius:8px;
    }
    .item-details {flex-grow:1;}

    button {
      padding:10px 15px; 
      background:#04AA6D; 
      color:white; 
      border:none; 
      cursor:pointer; 
      border-radius:4px; 
      margin-top:10px;
    }

    button:hover {opacity:0.9;}

  </style>
</head>
<body>

<div class="invoice-container">
  <!-- Where Information will load-->
  <h1>Invoice</h1>
  <p id="date"></p>
  <p id="customerInfo"></p>

  <!-- Price information-->
  <div id="orderItems"></div>
  <h3 id="subtotal"></h3>
  <h3 id="tax"></h3>
  <h3 id="totalPrice"></h3>

  <!--Print Button-->
  <button onclick="printInvoice()">Print Invoice</button>
</div>

<script>

  //Load the last order saved during checkout
  const order = JSON.parse(localStorage.getItem("lastOrder"));

  //If no oder exists, redirect user back to shop
  if(!order){
    alert("No order found!");
    window.location.href="shop.html";
  }
//Display Order date
  document.getElementById("date").textContent = "Date: " + order.date;
  //Display Customer Info
  document.getElementById("customerInfo").innerHTML = `Customer: ${order.customer.name}<br>Email: ${order.customer.email}<br>Address: ${order.customer.address}`;

  //Display Lists of items Purchased
  const orderItemsContainer = document.getElementById("orderItems");
  order.items.forEach(item=>{
    const div = document.createElement("div");
    div.className="item";
    div.innerHTML = `
      <img src="${item.img}" alt="${item.name}">
      <div class="item-details">
        <strong>${item.name}</strong> - $${item.price} x ${item.quantity} = $${(item.price*item.quantity).toFixed(2)}
      </div>
    `;
    orderItemsContainer.appendChild(div);
  });
// Display price caculation 
  document.getElementById("subtotal").textContent = "Subtotal: $" + order.subtotal.toFixed(2);
  document.getElementById("tax").textContent = "Tax (10%): $" + order.tax.toFixed(2);
  document.getElementById("totalPrice").textContent = "Total: $" + order.total.toFixed(2);
// Print invoice 
  function printInvoice(){ window.print(); }
</script>

</body>
</html>
