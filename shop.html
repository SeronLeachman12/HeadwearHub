<!DOCTYPE html>
<html lang="en">
<head>
  <title>Headwear Hub - Shop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {font-family: Arial, Helvetica, sans-serif; background-color: #f4f4f4;}
    header {
        background-color: #ff8c00; 
        color: #fff; padding: 20px; 
        display:flex; justify-content:space-between; 
        align-items:center;}

    .product {
        background:white
        padding: 15px; 
        margin:15px; 
        display:inline-block;
        width:200px; 
        text-align:center;
    }

   

       nav button {
      margin-left:10px; 
      padding:8px 12px; 
      cursor:pointer; 
      background:#171717;  
      color:white; 
      border:none; 
      border-radius:4px;
    }

    nav button:hover {opacity:0.9;}

    .cart-count {
        background:red;
        color:white; 
        border-radius:50%;
        padding:2px 8px; 
        margin-left:5px;
      }
  </style>
</head>
<body>

<header>
 <h1>Headwear Hub Shop</h1>
  <div>
    <nav>
    <button onclick="goCart()">Cart <span id="cartCount">0</span></button>
    <button onclick="logout()">Logout</button>
    <button onclick="aboutUs()">About Us</button>
    </nav>
  </div>
</header>

<div id="productsContainer"></div>

<script>
  
  // Check Login
  
  const loggedIn = localStorage.getItem("loggedIn") === "true" || sessionStorage.getItem("loggedIn") === "true";
  if(!loggedIn) window.location.href="login.html";


  function aboutUs() {
    window.location.href="aboutUs.html";
  }
 
  // Logout Function
  
  function logout() {
    localStorage.removeItem("loggedIn");
    sessionStorage.removeItem("loggedIn");
    alert("Logged out!");
    window.location.href="login.html";
  }

  
  // Prouduct List With Images
  
  const products = [
    {name: "Orange Beanie", price: 4.60, img: "images/Orange Beanie.jpg", quantity:1},
    {name: "Street Cap", price: 6, img: "images/Street Cap.jpg", quantity:1},
    {name: "Sun Hat", price: 20, img: "images/Sun Hat.jpg", quantity:1},
    {name: "Snapback", price: 6, img: "images/Snapback.jpg", quantity:1}
  ];

  const container = document.getElementById("productsContainer");

  
  // Load Prouducts
  
  function loadProducts() {
    container.innerHTML = "";
    products.forEach((p, index) => {
      const div = document.createElement("div");
      div.className = "product";
      div.innerHTML = `
        <img src="${p.img}" alt="${p.name}" style="width:100px;height:100px;"><br>
        <h3>${p.name}</h3>
        <p>$${p.price}</p>
        <button onclick="addToCart(${index})">Add to Cart</button>
      `;
      container.appendChild(div);
    });
  }

 
  // Cart Functionality
  
  function addToCart(index) {
    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    cart.push(products[index]);
    localStorage.setItem("cart", JSON.stringify(cart));
    updateCartCount();
  }

  function updateCartCount() {
    const cart = JSON.parse(localStorage.getItem("cart")) || [];
    document.getElementById("cartCount").textContent = cart.length;
  }

  function goCart() {
    window.location.href="cart.html";
  }

  loadProducts();
  updateCartCount();
</script>


</body>
</html>
