<!DOCTYPE html>
<html lang="en">
<head>
  <title>Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {font-family: Arial, Helvetica, sans-serif;}

form {border: 3px solid #f1f1f1;}

input[type=text], input[type=password] {
  width: 30%;
  padding: 12px 20px;
  margin: 8px 0;
  display: inline-block;
  border: 1px solid #ccc;
  box-sizing: border-box;
}

.password-wrapper {
  position: relative;
  width: 30%;
}

.eye-icon {
  position: absolute;
  right: 10px;
  top: 14px;
  cursor: pointer;
  font-size: 18px;
}

button {
  background-color: #04AA6D;
  color: white;
  padding: 14px 20px;
  margin: 8px 0;
  border: none;
  cursor: pointer;
  width: 20%;
}

button:hover {
  opacity: 0.8;
}

.cancelbtn {
  width: auto;
  padding: 10px 18px;
  background-color: #f44336;
}

.imgcontainer {
  text-align: center;
  margin: 24px 0 12px 0;
}

img.avatar {
  width: 30%;
  border-radius: 50%;
}

.container {
  padding: 16px;
}

span.psw {
  float: right;
  padding-top: 16px;
}

@media screen and (max-width: 300px) {
  span.psw {
     display: block;
     float: none;
  }
  .cancelbtn {
     width: 20%;
  }
}

footer {
  background-color: #222;
  color: #fff;
  text-align: center;
  padding: 20px;
  margin-top: 60px;
}

footer p {
  font-size: 14px;
  margin: 0;
}
</style>
</head>
<body>

<h2>Headwear Hub</h2>

<form id="loginForm">
  <div class="imgcontainer">
    <img src="./images/Logo.png" alt="Avatar" class="avatar">
  </div>

  <div class="container">
    <center>

    <!-- Username / Email -->
    <label for="email"><b>Email</b></label>
    <input type="text" placeholder="Enter Email" id="email" required><br>

    <!-- Password field with ahow/hide icon -->
    <div class="password-wrapper">
        <label for="psw"><b>Password</b></label>
      <input type="password" placeholder="Enter Password" id="psw" required>
      <span class="eye-icon" onclick="togglePassword()">👁️</span>
    </div>
    <br><br>

    <!-- Login button -->
    <button type="submit">Login</button><br>

    <!-- Remember me option -->
    <label>
      <input type="checkbox" id="rememberMe" checked> Remember me
    </label>

    <p>Create an account? <a href="./register.html">Register</a>.</p>
    </center>
  </div>

  <div class="container" style="background-color:#f1f1f1">
   <button type="button" class="cancelbtn">Cancel</button>
    <span class="psw">Forgot <a href="#">password?</a></span>
  </div>
</form>

<footer>
  <p>© 2025 Headwear Hub — All Rights Reserved</p>
</footer>


<script>

 // Show/Hide Password
 
function togglePassword() {
  const psw = document.getElementById("psw");
  const icon = event.target;

  if (psw.type === "password") {
    psw.type = "text";
    icon.textContent = "🙈"; // Change icon
  } else {
    psw.type = "password";
    icon.textContent = "👁️"; // Change icon back
  }
}


  //Login Form Logic
 
const loginForm = document.getElementById("loginForm");

loginForm.addEventListener("submit", function(e) {
  e.preventDefault(); // Stop form from refreshing page

  // Get user inputs
  const email = document.getElementById("email").value;
  const password = document.getElementById("psw").value;
  const remember = document.getElementById("rememberMe").checked;

  // Retrieve saved account from localStorage
  const savedUser = JSON.parse(localStorage.getItem("user"));

  
   //Check if user exists
   
  if (!savedUser) {
    alert("No registered account found. Please register first.");
    return;
  }

  
    // Validate Login
   
  if (email === savedUser.email && password === savedUser.password) {

    // Optional: Save session if "Remember me" is checked
    if (remember) {
      localStorage.setItem("loggedIn", "true");
    } else {
      sessionStorage.setItem("loggedIn", "true");
    }

    alert("Login Successful!");

    // Redirect to homepage or dashboard
    window.location.href = "index.html"; // Change to your home page

  } else {
    alert("Incorrect email or password.");
  }
});
</script>

</body>
</html>
